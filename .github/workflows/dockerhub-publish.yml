name: Publish Docker Hub image

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  dockerhub_credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.detect.outputs.enabled }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Detect Docker Hub publishing credentials
        id: detect
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Docker Hub publishing enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub publishing skipped: configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets to enable it."
          fi

  publish:
    needs: dockerhub_credentials
    if: ${{ needs.dockerhub_credentials.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/upkk-cs2-server-manager
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Docker Hub credentials
        run: |
          test -n "$DOCKERHUB_USERNAME" || (echo "Missing DOCKERHUB_USERNAME repository secret" >&2; exit 1)
          test -n "$DOCKERHUB_TOKEN" || (echo "Missing DOCKERHUB_TOKEN repository secret" >&2; exit 1)

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Capture build metadata
        id: build-metadata
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            GIT_SHA=${{ steps.build-metadata.outputs.sha }}
            BUILD_TIME=${{ steps.build-metadata.outputs.time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-frontend:
    needs: dockerhub_credentials
    if: ${{ needs.dockerhub_credentials.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/upkk-cs2-server-manager-web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Docker Hub credentials
        run: |
          test -n "$DOCKERHUB_USERNAME" || (echo "Missing DOCKERHUB_USERNAME repository secret" >&2; exit 1)
          test -n "$DOCKERHUB_TOKEN" || (echo "Missing DOCKERHUB_TOKEN repository secret" >&2; exit 1)

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Extract frontend image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Capture frontend build metadata
        id: build-metadata
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Prepare frontend Server Actions key
        env:
          CONFIGURED_ACTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
        run: |
          key_file="$RUNNER_TEMP/next-server-actions.key"
          if [ -n "$CONFIGURED_ACTION_KEY" ]; then
            printf '%s' "$CONFIGURED_ACTION_KEY" > "$key_file"
          else
            openssl rand -base64 32 | tr -d '\r\n' > "$key_file"
          fi
          chmod 600 "$key_file"

      - name: Build and push frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            GIT_SHA=${{ steps.build-metadata.outputs.sha }}
            BUILD_TIME=${{ steps.build-metadata.outputs.time }}
            DEPLOYMENT_ID=${{ steps.build-metadata.outputs.sha }}
          secret-files: |
            next_server_actions_key=${{ runner.temp }}/next-server-actions.key
          cache-from: type=gha
          cache-to: type=gha,mode=max
