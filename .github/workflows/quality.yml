name: Quality baseline

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: cs2_manager
          POSTGRES_USER: cs2_manager
          POSTGRES_PASSWORD: your_postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cs2_manager -d cs2_manager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install locked Python dependencies
        run: uv sync --locked --group dev

      - name: Verify locked frontend dependencies
        run: npm ci

      - name: Run quality baseline
        run: uv run python scripts/check_baseline.py

      - name: Run PostgreSQL 18 integration contracts
        env:
          RUN_POSTGRES_INTEGRATION: "1"
        run: uv run pytest -q tests/test_postgresql_migrations.py

  legacy-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: cs2_manager
          POSTGRES_USER: cs2_manager
          POSTGRES_PASSWORD: your_postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cs2_manager -d cs2_manager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: legacy_cs2_manager
          MYSQL_USER: legacy
          MYSQL_PASSWORD: legacy_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -proot_password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install migration dependencies
        run: uv sync --locked --group dev --extra legacy-mysql-migration

      - name: Run MySQL to PostgreSQL migration integration contracts
        env:
          RUN_LEGACY_MYSQL_INTEGRATION: "1"
          LEGACY_MYSQL_DATABASE_URL: mysql+aiomysql://legacy:legacy_password@127.0.0.1:3306/legacy_cs2_manager
        run: >-
          uv run --extra legacy-mysql-migration pytest -q
          tests/test_legacy_mysql_postgresql_integration.py
