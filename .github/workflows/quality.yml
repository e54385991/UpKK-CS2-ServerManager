name: Quality baseline

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: cs2_manager
      POSTGRES_PASSWORD: your_postgres_password
      POSTGRES_DATABASE: cs2_manager
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_POOL_SIZE: "10"
      REDIS_HEALTH_CHECK_INTERVAL: "30"
      REDIS_SOCKET_CONNECT_TIMEOUT: "5"
      REDIS_SOCKET_TIMEOUT: "5"
      API_HOST: 127.0.0.1
      API_PORT: "8000"
      BACKEND_URL: http://127.0.0.1:8000
      LOG_LEVEL: INFO
      ASYNCSSH_LOG_LEVEL: WARNING
      SECRET_KEY: ci-secret-key-must-be-at-least-32-characters
      JWT_SECRET_KEY: ci-jwt-secret-key-must-be-at-least-32
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "10080"
      SSH_AUTH_MODE: password

    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: cs2_manager
          POSTGRES_USER: cs2_manager
          POSTGRES_PASSWORD: your_postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cs2_manager -d cs2_manager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8.10.2-alpine3.23@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and stable Python 3.15
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version-file: ".python-version"
          enable-cache: true

      - name: Assert stable Python 3.15 runtime
        run: |
          python -c 'import sys, sysconfig; print(sys.version); assert sys.version_info == (3, 15, 0, "final", 0); assert not sysconfig.get_config_var("Py_GIL_DISABLED")'

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.11.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked Python dependencies
        run: uv sync --locked --group dev

      - name: Verify locked Next.js dependencies
        run: npm ci --prefix frontend

      - name: Run quality baseline
        run: uv run python scripts/check_baseline.py

      - name: Run PostgreSQL 18 integration contracts
        env:
          RUN_POSTGRES_INTEGRATION: "1"
        run: >-
          uv run python -m pytest -q tests/test_postgresql_migrations.py
          -W error::DeprecationWarning -W error::PendingDeprecationWarning

  compose-health:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CS2_MANAGER_IMAGE: upkk-backend-ci:${{ github.sha }}
      CS2_FRONTEND_IMAGE: upkk-frontend-ci:${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate and start Compose services
        run: |
          docker compose config --quiet
          docker compose up -d --build --wait

      - name: Verify service health endpoints
        run: |
          test "$(docker compose exec -T redis redis-cli ping)" = "PONG"
          docker compose exec -T postgres pg_isready -U cs2_manager -d cs2_manager
          docker compose exec -T app python -c 'import platform, sysconfig; print(platform.python_version()); assert platform.python_version() == "3.15.0rc3"; assert not sysconfig.get_config_var("Py_GIL_DISABLED")'
          docker compose exec -T app python -c 'import urllib.request; assert urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3).status == 200'
          docker compose exec -T frontend node -e 'fetch("http://127.0.0.1:3000/health").then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'

      - name: Run backend and PostgreSQL contracts on the container runtime
        run: |
          docker build --target dependencies --tag upkk-backend-contracts .
          network=$(docker inspect cs2_postgres --format '{{range $name, $_ := .NetworkSettings.Networks}}{{println $name}}{{end}}' | head -n 1)
          docker run --rm --network "$network" \
            --volume "$PWD:/app" --workdir /app \
            --env POSTGRES_HOST=127.0.0.1 --env REDIS_HOST=127.0.0.1 \
            --env UV_PYTHON=/usr/local/bin/python \
            --env UV_PROJECT_ENVIRONMENT=/opt/venv \
            --entrypoint /bin/sh upkk-backend-contracts -ec '
              apk add --no-cache bash cargo git
              uv sync --locked --group dev --no-python-downloads
              uv run --no-sync python -m pytest -q \
                -W error::DeprecationWarning -W error::PendingDeprecationWarning \
                --cov=api --cov=modules --cov=services --cov-branch \
                --cov-fail-under=86.70 --cov-report=term-missing
              POSTGRES_HOST=postgres REDIS_HOST=redis POSTGRES_PASSWORD=cs2-manager-db \
                RUN_POSTGRES_INTEGRATION=1 uv run --no-sync python -m pytest -q \
                tests/test_postgresql_migrations.py \
                -W error::DeprecationWarning -W error::PendingDeprecationWarning
            '

      - name: Tear down Compose services
        if: always()
        run: docker compose down -v

  frontend-playwright-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.11.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run public Next.js smoke flow
        run: npx playwright test e2e/tutorial.spec.ts --project=anon

      - name: Verify isolated overview streaming and failure recovery
        run: npx playwright test --config=playwright.overview.config.ts

      - name: Verify isolated render deduplication, streaming and lazy dialogs
        run: npx playwright test --config=playwright.performance.config.ts

      - name: Verify isolated system-monitoring dashboard
        run: npx playwright test --config=playwright.monitor.config.ts

  frontend-production-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.11.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build an isolated candidate with the test API
        run: node scripts/prepare-cache-components.mjs "$PWD" /tmp/upkk-cc-build-candidate candidate
      - name: Verify the candidate production bundle budget with test API disabled
        run: node scripts/prepare-cache-components.mjs "$PWD" /tmp/upkk-cc-build-candidate-production candidate memory
      - name: Verify production navigation and functional contracts
        env:
          CC_BUILD_ROOT: /tmp/upkk-cc-build-candidate
        run: npm run test:cache-components
