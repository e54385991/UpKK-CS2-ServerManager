name: Quality baseline

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: cs2_manager
          POSTGRES_USER: cs2_manager
          POSTGRES_PASSWORD: your_postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cs2_manager -d cs2_manager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8.10.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install locked Python dependencies
        run: uv sync --locked --group dev

      - name: Verify locked frontend dependencies
        run: npm ci

      - name: Verify locked Next.js dependencies
        run: npm ci --prefix frontend

      - name: Run quality baseline
        run: uv run python scripts/check_baseline.py

      - name: Run PostgreSQL 18 integration contracts
        env:
          RUN_POSTGRES_INTEGRATION: "1"
        run: uv run pytest -q tests/test_postgresql_migrations.py

  legacy-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: cs2_manager
          POSTGRES_USER: cs2_manager
          POSTGRES_PASSWORD: your_postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cs2_manager -d cs2_manager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_DATABASE: legacy_cs2_manager
          MYSQL_USER: legacy
          MYSQL_PASSWORD: legacy_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -proot_password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install migration dependencies
        run: uv sync --locked --group dev --extra legacy-mysql-migration

      - name: Run MySQL to PostgreSQL migration integration contracts
        env:
          RUN_LEGACY_MYSQL_INTEGRATION: "1"
          LEGACY_MYSQL_DATABASE_URL: mysql+aiomysql://legacy:legacy_password@127.0.0.1:3306/legacy_cs2_manager
        run: >-
          uv run --extra legacy-mysql-migration pytest -q
          tests/test_legacy_mysql_postgresql_integration.py

  compose-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate and start Compose services
        run: |
          docker compose config --quiet
          docker compose up -d --wait

      - name: Verify service health endpoints
        run: |
          test "$(docker compose exec -T redis redis-cli ping)" = "PONG"
          docker compose exec -T postgres pg_isready -U cs2_manager -d cs2_manager

      - name: Tear down Compose services
        if: always()
        run: docker compose down -v

  frontend-playwright-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run public Next.js smoke flow
        run: npx playwright test e2e/tutorial.spec.ts --project=anon
