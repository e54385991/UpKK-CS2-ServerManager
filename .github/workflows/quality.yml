name: Quality baseline

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: cs2_manager
      POSTGRES_PASSWORD: your_postgres_password
      POSTGRES_DATABASE: cs2_manager
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_POOL_SIZE: "10"
      REDIS_HEALTH_CHECK_INTERVAL: "30"
      REDIS_SOCKET_CONNECT_TIMEOUT: "5"
      REDIS_SOCKET_TIMEOUT: "5"
      API_HOST: 127.0.0.1
      API_PORT: "8000"
      BACKEND_URL: http://127.0.0.1:8000
      LOG_LEVEL: INFO
      ASYNCSSH_LOG_LEVEL: WARNING
      SECRET_KEY: ci-secret-key-must-be-at-least-32-characters
      JWT_SECRET_KEY: ci-jwt-secret-key-must-be-at-least-32
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "10080"
      SSH_AUTH_MODE: password

    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: cs2_manager
          POSTGRES_USER: cs2_manager
          POSTGRES_PASSWORD: your_postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cs2_manager -d cs2_manager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8.10.2-alpine3.23@sha256:72cedd9603038893af961e90ac5e1a1a0d8377d5e338dbdad8fe284ea25de18f
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked Python dependencies
        run: uv sync --locked --group dev

      - name: Verify locked Next.js dependencies
        run: npm ci --prefix frontend

      - name: Run quality baseline
        run: uv run python scripts/check_baseline.py

      - name: Run PostgreSQL 18 integration contracts
        env:
          RUN_POSTGRES_INTEGRATION: "1"
        run: uv run pytest -q tests/test_postgresql_migrations.py

  compose-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate and start Compose services
        run: |
          docker compose config --quiet
          docker compose up -d --wait

      - name: Verify service health endpoints
        run: |
          test "$(docker compose exec -T redis redis-cli ping)" = "PONG"
          docker compose exec -T postgres pg_isready -U cs2_manager -d cs2_manager

      - name: Tear down Compose services
        if: always()
        run: docker compose down -v

  frontend-playwright-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run public Next.js smoke flow
        run: npx playwright test e2e/tutorial.spec.ts --project=anon

      - name: Verify isolated overview streaming and failure recovery
        run: npx playwright test --config=playwright.overview.config.ts

      - name: Verify isolated render deduplication, streaming and lazy dialogs
        run: npx playwright test --config=playwright.performance.config.ts

      - name: Verify isolated system-monitoring dashboard
        run: npx playwright test --config=playwright.monitor.config.ts
