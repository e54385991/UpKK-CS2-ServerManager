services:
  app:
    image: ${CS2_MANAGER_IMAGE}
    container_name: ${CONTAINER_NAME}
    restart: always
    environment:
      PANEL_DB_TYPE: ${PANEL_DB_TYPE}
      POSTGRES_HOST: ${PANEL_DB_HOST}
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${PANEL_DB_USER}
      POSTGRES_PASSWORD: ${PANEL_DB_USER_PASSWORD}
      POSTGRES_DATABASE: ${PANEL_DB_NAME}
      PANEL_REDIS_TYPE: ${PANEL_REDIS_TYPE}
      REDIS_HOST: ${PANEL_REDIS_HOST}
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${PANEL_REDIS_ROOT_PASSWORD}
      REDIS_DB: ${PANEL_REDIS_DB}
      REDIS_KEY_PREFIX: ${CONTAINER_NAME}
      SESSION_COOKIE_SUFFIX: ${PANEL_APP_PORT_HTTP}
      REDIS_POOL_SIZE: "10"
      REDIS_HEALTH_CHECK_INTERVAL: "30"
      REDIS_SOCKET_CONNECT_TIMEOUT: "5"
      REDIS_SOCKET_TIMEOUT: "5"
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      DEBUG: "False"
      BACKEND_URL: ${BACKEND_URL}
      CONSOLE_PUBLIC_URL: ${BACKEND_URL}
      LOG_LEVEL: INFO
      ASYNCSSH_LOG_LEVEL: WARNING
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "10080"
      AI_CREDENTIAL_ENCRYPTION_KEY: ""
      SSH_AUTH_MODE: password
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    image: ${CS2_FRONTEND_IMAGE}
    container_name: ${CONTAINER_NAME}-web
    restart: always
    environment:
      INTERNAL_API_URL: http://${CONTAINER_NAME}:8000
      SESSION_COOKIE_SUFFIX: ${PANEL_APP_PORT_HTTP}
    expose:
      - "3000"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  caddy:
    image: caddy:2.11-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: ${CONTAINER_NAME}-edge
    restart: always
    ports:
      - "${PANEL_APP_PORT_HTTP}:80"
    environment:
      FRONTEND_UPSTREAM: ${CONTAINER_NAME}-web:3000
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - frontend
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true
