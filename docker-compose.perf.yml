# Isolated PostgreSQL 18 + Redis 8 for performance measurement.
# Bind loopback only. Do not point this file at a live panel volume.
# Default host ports are 55432 / 56379. Override with UPKK_PERF_POSTGRES_PORT
# and UPKK_PERF_REDIS_PORT when another loopback project already owns those.
# Usage: docker compose -f docker-compose.perf.yml up -d --wait
name: upkk-perf

services:
  postgres:
    image: postgres:18.6-alpine@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
    container_name: upkk_perf_postgres
    restart: "no"
    environment:
      POSTGRES_DB: cs2_perf
      POSTGRES_USER: cs2_perf
      POSTGRES_PASSWORD: cs2-perf-db-not-production
    ports:
      - "127.0.0.1:${UPKK_PERF_POSTGRES_PORT:-55432}:5432"
    volumes:
      - perf_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cs2_perf -d cs2_perf"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.1-alpine@sha256:bd999b5cfee25fb24b8320a31fddbd69f462df44c8138c66e369582937beebc0
    container_name: upkk_perf_redis
    restart: "no"
    ports:
      - "127.0.0.1:${UPKK_PERF_REDIS_PORT:-56379}:6379"
    volumes:
      - perf_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  perf_postgres_data:
  perf_redis_data:
