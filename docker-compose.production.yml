x-app-environment: &app-environment
  env_file:
    - .env
  environment:
    ENVIRONMENT: production
    DEBUG: "false"
    MYSQL_HOST: mysql
    MYSQL_PORT: "3306"
    REDIS_HOST: redis
    REDIS_PORT: "6379"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    <<: *app-environment
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cs2_network
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Run explicitly before starting/upgrading the app:
  # docker compose -f docker-compose.yml -f docker-compose.production.yml \
  #   --profile tools run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    <<: *app-environment
    command: ["python", "-m", "cs2_manager.migrate", "upgrade"]
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - cs2_network
    profiles: ["tools"]
    restart: "no"
    security_opt:
      - no-new-privileges:true
