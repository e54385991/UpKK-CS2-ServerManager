services:
  app:
    image: ${CS2_MANAGER_IMAGE:-docker.io/e54385991/upkk-cs2-server-manager:main}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cs2_manager
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-cs2_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cs2-manager-db}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-cs2_manager}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-10}
      REDIS_HEALTH_CHECK_INTERVAL: ${REDIS_HEALTH_CHECK_INTERVAL:-30}
      REDIS_SOCKET_CONNECT_TIMEOUT: ${REDIS_SOCKET_CONNECT_TIMEOUT:-5}
      REDIS_SOCKET_TIMEOUT: ${REDIS_SOCKET_TIMEOUT:-5}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DEBUG: ${DEBUG:-False}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
      CONSOLE_PUBLIC_URL: ${CONSOLE_PUBLIC_URL:-http://localhost:3000}
      LEGACY_HTML_CONSOLE: ${LEGACY_HTML_CONSOLE:-redirect}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ASYNCSSH_LOG_LEVEL: ${ASYNCSSH_LOG_LEVEL:-WARNING}
      SECRET_KEY: ${SECRET_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      AI_CREDENTIAL_ENCRYPTION_KEY: ${AI_CREDENTIAL_ENCRYPTION_KEY:-}
      SSH_AUTH_MODE: ${SSH_AUTH_MODE:-password}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    expose:
      - "8000"
    # Public HTTP is Caddy → Next. Keep 8000 published only for local API debugging.
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cs2_network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:18.6-alpine
    container_name: cs2_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-cs2_manager}
      POSTGRES_USER: ${POSTGRES_USER:-cs2_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cs2-manager-db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - cs2_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.10.1-alpine
    container_name: cs2_redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - /bin/sh
      - -ec
      - |
        if [ -n "$${REDIS_PASSWORD:-}" ]; then
          exec redis-server --requirepass "$${REDIS_PASSWORD}"
        else
          exec redis-server
        fi
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cs2_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$${REDIS_PASSWORD:-}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: ${CS2_FRONTEND_IMAGE:-docker.io/e54385991/upkk-cs2-server-manager-web:main}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cs2_frontend
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://app:8000
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost}
    expose:
      - "3000"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - cs2_network

  caddy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    container_name: cs2_caddy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - frontend
    networks:
      - cs2_network

volumes:
  app_data:
  postgres_data:
  redis_data:

networks:
  cs2_network:
    driver: bridge
