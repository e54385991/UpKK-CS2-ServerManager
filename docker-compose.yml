# Zero-config stack. Images come from Docker Hub; no other repo files needed:
#   curl -fsSLO https://raw.githubusercontent.com/e54385991/UpKK-CS2-ServerManager/main/docker-compose.yml
#   docker compose up -d
# Open http://<host>:3000  (admin / admin123). Change the password immediately.
#
# Next proxies /api to the `app` service on the private network. Do not set
# INTERNAL_API_URL to a LAN IP. Secrets are created on first start in app_data.
#
# Optional: `docker compose --profile edge up -d` also publishes Caddy on :80.
# Optional: `docker compose -f docker-compose.yml -f docker-compose.debug.yml up -d`
# publishes FastAPI / Postgres / Redis for local debugging.

name: cs2-server-manager

services:
  app:
    image: ${CS2_MANAGER_IMAGE:-docker.io/e54385991/upkk-cs2-server-manager:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    container_name: cs2_manager
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-cs2_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cs2-manager-db}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-cs2_manager}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-10}
      REDIS_HEALTH_CHECK_INTERVAL: ${REDIS_HEALTH_CHECK_INTERVAL:-30}
      REDIS_SOCKET_CONNECT_TIMEOUT: ${REDIS_SOCKET_CONNECT_TIMEOUT:-5}
      REDIS_SOCKET_TIMEOUT: ${REDIS_SOCKET_TIMEOUT:-5}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DEBUG: ${DEBUG:-False}
      RUN_MODE: ${RUN_MODE:-production}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:3000}
      CONSOLE_PUBLIC_URL: ${CONSOLE_PUBLIC_URL:-http://localhost:3000}
      LEGACY_HTML_CONSOLE: ${LEGACY_HTML_CONSOLE:-redirect}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ASYNCSSH_LOG_LEVEL: ${ASYNCSSH_LOG_LEVEL:-WARNING}
      SECRET_KEY: ${SECRET_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      AI_CREDENTIAL_ENCRYPTION_KEY: ${AI_CREDENTIAL_ENCRYPTION_KEY:-}
      SSH_AUTH_MODE: ${SSH_AUTH_MODE:-password}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Optional Steam/GitHub egress (China / locked-down Docker). Do not set
      # these to empty strings. Example: HTTPS_PROXY=http://host.docker.internal:7890
      # HTTP_PROXY: ${HTTP_PROXY}
      # HTTPS_PROXY: ${HTTPS_PROXY}
      # NO_PROXY: localhost,127.0.0.1,postgres,redis,web,app
    expose:
      - "8000"
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cs2_network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:18.6-alpine
    container_name: cs2_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-cs2_manager}
      POSTGRES_USER: ${POSTGRES_USER:-cs2_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cs2-manager-db}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - cs2_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.10.1-alpine
    container_name: cs2_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - /bin/sh
      - -ec
      - |
        if [ -n "$${REDIS_PASSWORD:-}" ]; then
          exec redis-server --requirepass "$${REDIS_PASSWORD}"
        else
          exec redis-server
        fi
    volumes:
      - redis_data:/data
    networks:
      - cs2_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$${REDIS_PASSWORD:-}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: ${CS2_FRONTEND_IMAGE:-docker.io/e54385991/upkk-cs2-server-manager-web:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    container_name: cs2_frontend
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: ${FRONTEND_INTERNAL_API_URL:-http://app:8000}
    ports:
      - "${HTTP_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - cs2_network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  caddy:
    profiles: ["edge"]
    image: caddy:2.11-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: cs2_caddy
    restart: unless-stopped
    ports:
      - "${EDGE_PORT:-80}:80"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/Caddyfile <<'EOF'
        {
        	admin off
        }
        :80 {
        	encode gzip
        	reverse_proxy frontend:3000 {
        		flush_interval -1
        	}
        }
        EOF
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - cs2_network

volumes:
  app_data:
  postgres_data:
  redis_data:

networks:
  cs2_network:
    driver: bridge
