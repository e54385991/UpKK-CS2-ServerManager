services:
  postgres:
    image: postgres:18.6-alpine
    container_name: cs2_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-cs2_manager}
      POSTGRES_USER: ${POSTGRES_USER:-cs2_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - cs2_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.10.1-alpine
    container_name: cs2_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cs2_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  cs2_network:
    driver: bridge
