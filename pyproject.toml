[project]
name = "cs2-server-manager"
version = "0.1.0"
description = "CS2 Server Manager web panel"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "starlette>=1.6.0",
    "uvicorn[standard]>=0.52.4",
    "sqlmodel>=0.0.39",
    "sqlalchemy[asyncio]>=2.0.52",
    "alembic>=1.19.1",
    "psycopg[binary]>=3.3.4",
    "redis[hiredis]>=8.1.0",
    "python-dotenv>=1.2.3",
    "pydantic>=2.13.4,<3.0.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "anyio>=4.14.2",
    "asyncssh>=2.24.0",
    "jinja2>=3.1.6",
    "bcrypt>=5.0.0,<6.0.0",
    "PyJWT[crypto]>=2.13.0,<3.0.0",
    "python-multipart>=0.0.32",
    "email-validator>=2.3.0",
    "python-a2s>=1.4.2",
    "httpx>=0.28.1",
    "captcha>=0.7.1",
    "google-auth>=2.57.0",
    "google-auth-oauthlib>=1.4.1",
    "google-api-python-client>=2.199.0",
    "requests>=2.34.2,<3.0.0",
    "boto3>=1.43.79",
    "cryptography>=50.0.0",
    "py7zr>=1.1.3",
]

[project.optional-dependencies]
legacy-mysql-migration = [
    "aiomysql>=0.3.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]

[tool.ruff.format]
exclude = ["*.md"]
