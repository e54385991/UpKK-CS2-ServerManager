[project]
name = "cs2-server-manager"
version = "0.1.0"
description = "CS2 Server Manager web panel"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.140.0",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.51.0",
    "sqlmodel>=0.0.39",
    "sqlalchemy[asyncio]>=2.0.51",
    "aiomysql>=0.3.2",
    "redis[hiredis]>=8.0.1",
    "python-dotenv>=1.2.2",
    "pydantic>=2.13.4,<3.0.0",
    "pydantic-settings>=2.14.2,<3.0.0",
    "anyio>=4.14.2",
    "asyncssh>=2.24.0",
    "jinja2>=3.1.6",
    "bcrypt>=5.0.0,<6.0.0",
    "PyJWT[crypto]>=2.13.0,<3.0.0",
    "python-multipart>=0.0.32",
    "email-validator>=2.3.0",
    "python-a2s>=1.4.2",
    "httpx>=0.28.1",
    "captcha>=0.7.1",
    "google-auth>=2.56.2",
    "google-auth-oauthlib>=1.4.0",
    "google-api-python-client>=2.198.0",
    "requests>=2.34.2,<3.0.0",
    "boto3>=1.43.56",
    "cryptography>=49.0.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]

[tool.ruff.format]
exclude = ["*.md"]
