[project]
name = "cs2-server-manager"
version = "0.1.0"
description = "CS2 Server Manager web panel"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16.5,<2.0.0",
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
    "sqlmodel>=0.0.39",
    "sqlalchemy[asyncio]>=2.0.51",
    "aiomysql>=0.3.2",
    "redis[hiredis]>=8.0.1",
    "python-dotenv>=1.2.2",
    "pydantic>=2.13.4,<3.0.0",
    "pydantic-settings>=2.14.2,<3.0.0",
    "anyio>=4.14.2",
    "asyncssh>=2.24.0",
    "jinja2>=3.1.6",
    "bcrypt>=5.0.0,<6.0.0",
    "PyJWT[crypto]>=2.13.0,<3.0.0",
    "python-multipart>=0.0.32",
    "email-validator>=2.3.0",
    "python-a2s>=1.4.2",
    "httpx>=0.28.1",
    "captcha>=0.7.1",
    "google-auth>=2.56.2",
    "google-auth-oauthlib>=1.4.0",
    "google-api-python-client>=2.198.0",
    "requests>=2.34.2,<3.0.0",
    "boto3>=1.43.53",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "basedpyright>=1.31.7,<2.0.0",
    "diff-cover>=9.7.1,<10.0.0",
    "import-linter>=2.7.0,<3.0.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "redis_integration: use a real Redis coordination store",
    "integration: requires real MySQL and Redis services",
    "performance: acceptance/load scenario reserved for scheduled CI",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["api", "cs2_manager", "modules", "services"]

[tool.coverage.report]
skip_empty = true
show_missing = true

[tool.basedpyright]
include = [
    "cs2_manager/core",
    "cs2_manager/infrastructure",
    "cs2_manager/runtime",
]
pythonVersion = "3.14"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
