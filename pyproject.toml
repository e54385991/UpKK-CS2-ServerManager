[project]
name = "cs2-server-manager"
version = "0.1.0"
description = "CS2 Server Manager web panel"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "starlette>=1.6.0",
    "uvicorn[standard]>=0.53.0",
    "sqlmodel>=0.0.43",
    "sqlalchemy[asyncio]>=2.0.54",
    "alembic>=1.20.0",
    "psycopg[binary]>=3.3.6",
    "redis[hiredis]>=8.1.0",
    "python-dotenv>=1.2.3",
    "pydantic>=2.13.5,<3.0.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "anyio>=4.15.1",
    "asyncssh>=2.24.0",
    "bcrypt>=5.0.0,<6.0.0",
    "PyJWT[crypto]>=2.14.0,<3.0.0",
    "python-multipart>=0.0.32",
    "email-validator>=2.3.0",
    "python-a2s>=1.4.2",
    "httpx>=0.28.1",
    "captcha>=0.7.1",
    "google-auth>=2.58.0",
    "google-auth-oauthlib>=1.4.1",
    "google-api-python-client>=2.200.0",
    "requests>=2.34.2,<3.0.0",
    "boto3>=1.43.98",
    "cryptography>=50.0.1",
    "discord.py>=2.7.1,<3",
    "py7zr>=1.1.3",
    "webauthn>=3.0.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "basedpyright>=1.40.1,<2.0.0",
    "diff-cover>=10.5.1,<11.0.0",
    "grimp>=3.17,<4.0.0",
    "httpx2>=2.13.0,<3.0.0",
    "import-linter>=2.15,<3.0.0",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["api", "modules", "services"]

[tool.coverage.report]
skip_empty = true
show_missing = true

[tool.basedpyright]
include = ["api", "modules", "services"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
