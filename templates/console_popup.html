<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ console_type }} Console - Server {{ server_id }}</title>
    
    <!-- Xterm.js CSS -->
    <link rel="stylesheet" href="{{ static_url('xterm/xterm.css') }}">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1e1e1e;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        
        #terminal-container {
            width: 100%;
            height: 100%;
            padding: 0;
        }
        
        #terminal {
            width: 100%;
            height: 100%;
        }
        
        /* Scrollbar styling */
        #terminal::-webkit-scrollbar {
            width: 10px;
        }
        
        #terminal::-webkit-scrollbar-track {
            background: #1e1e1e;
        }
        
        #terminal::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 5px;
        }
        
        /* Xterm.js styling */
        .xterm {
            height: 100%;
            padding: 10px;
        }
        
        .xterm-viewport {
            background-color: #1e1e1e !important;
        }
        
        .xterm-screen {
            background-color: #1e1e1e !important;
        }
    </style>
</head>
<body>
    <div id="terminal-container">
        <div id="terminal"></div>
    </div>
    
    <!-- Xterm.js and addons -->
    <script src="{{ static_url('xterm/xterm.js') }}"></script>
    <script src="{{ static_url('xterm/xterm-addon-fit.js') }}"></script>
    <script src="{{ static_url('xterm/xterm-addon-web-links.js') }}"></script>
    
    <script>
        // Configuration
        const CONSOLE_TYPE = '{{ console_type }}'.toLowerCase();
        const SERVER_ID = {{ server_id }};
        
        // State
        let term = null;
        let ws = null;
        let fitAddon = null;
        let webLinksAddon = null;
        let reconnectAttempts = 0;
        const MAX_RECONNECT_ATTEMPTS = 3;
        let reconnectTimer = null;
        let heartbeatTimer = null;  // Add heartbeat timer
        
        // Initialize terminal
        function initTerminal() {
            // Determine theme based on console type
            const isSSH = CONSOLE_TYPE === 'ssh';
            const theme = isSSH ? {
                background: '#1e1e1e',
                foreground: '#d4d4d4',
                cursor: '#aeafad',
                cursorAccent: '#1e1e1e',
                selection: 'rgba(99, 150, 201, 0.3)',
                black: '#000000',
                red: '#cd3131',
                green: '#0dbc79',
                yellow: '#e5e510',
                blue: '#2472c8',
                magenta: '#bc3fbc',
                cyan: '#11a8cd',
                white: '#e5e5e5',
                brightBlack: '#666666',
                brightRed: '#f14c4c',
                brightGreen: '#23d18b',
                brightYellow: '#f5f543',
                brightBlue: '#3b8eea',
                brightMagenta: '#d670d6',
                brightCyan: '#29b8db',
                brightWhite: '#ffffff'
            } : {
                background: '#0e1419',
                foreground: '#d5d8df',
                cursor: '#f5f5f5',
                cursorAccent: '#0e1419',
                selection: 'rgba(72, 187, 120, 0.3)',
                black: '#000000',
                red: '#f56565',
                green: '#48bb78',
                yellow: '#ed8936',
                blue: '#4299e1',
                magenta: '#9f7aea',
                cyan: '#38b2ac',
                white: '#e2e8f0',
                brightBlack: '#4a5568',
                brightRed: '#fc8181',
                brightGreen: '#68d391',
                brightYellow: '#f6ad55',
                brightBlue: '#63b3ed',
                brightMagenta: '#b794f4',
                brightCyan: '#4fd1c5',
                brightWhite: '#f7fafc'
            };
            
            // Create xterm instance
            term = new Terminal({
                cursorBlink: true,
                cursorStyle: 'block',
                fontFamily: "'Cascadia Code', 'Consolas', 'Courier New', monospace",
                fontSize: isSSH ? 14 : 13,
                lineHeight: 1.2,
                theme: theme,
                allowProposedApi: true,
                scrollback: isSSH ? 10000 : 20000,
                convertEol: true
            });
            
            // Initialize addons
            fitAddon = new FitAddon.FitAddon();
            webLinksAddon = new WebLinksAddon.WebLinksAddon();
            
            term.loadAddon(fitAddon);
            term.loadAddon(webLinksAddon);
            
            // Open terminal
            term.open(document.getElementById('terminal'));
            
            // Fit terminal to container
            fitAddon.fit();
            
            // Show welcome message
            if (isSSH) {
                term.writeln('\x1b[1;36m╔════════════════════════════════════════════════╗\x1b[0m');
                term.writeln('\x1b[1;36m║         Interactive SSH Terminal              ║\x1b[0m');
                term.writeln('\x1b[1;36m╚════════════════════════════════════════════════╝\x1b[0m');
            } else {
                term.writeln('\x1b[1;32m╔════════════════════════════════════════════════╗\x1b[0m');
                term.writeln('\x1b[1;32m║         Game Server Console                    ║\x1b[0m');
                term.writeln('\x1b[1;32m╚════════════════════════════════════════════════╝\x1b[0m');
            }
            term.writeln('');
            term.writeln('Connecting...');
            term.writeln('');
            
            // Handle terminal input
            term.onData(data => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'input',
                        data: data
                    }));
                }
            });
            
            // Handle window resize
            window.addEventListener('resize', () => {
                fitAddon.fit();
                sendTerminalSize();
            });
            
            // Send terminal size on terminal resize
            term.onResize(({ cols, rows }) => {
                sendTerminalSize();
            });
            
            // Focus terminal
            term.focus();
            
            // Auto-connect after terminal is ready
            setTimeout(connectWebSocket, 100);
        }
        
        // Send terminal size to server
        function sendTerminalSize() {
            if (ws && ws.readyState === WebSocket.OPEN && term) {
                ws.send(JSON.stringify({
                    type: 'resize',
                    cols: term.cols,
                    rows: term.rows
                }));
            }
        }
        
        // Connect to WebSocket
        function connectWebSocket() {
            try {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const endpoint = CONSOLE_TYPE === 'ssh' ? 'ssh-console' : 'game-console';
                const wsUrl = `${protocol}//${window.location.host}/servers/${SERVER_ID}/${endpoint}`;
                
                ws = new WebSocket(wsUrl);
                
                ws.onopen = () => {
                    reconnectAttempts = 0;
                    term.writeln('\x1b[32m✓ Connected\x1b[0m');
                    term.writeln('');
                    
                    // Send initial terminal size
                    setTimeout(() => {
                        sendTerminalSize();
                    }, 100);
                    
                    // Start heartbeat for game console to keep connection alive
                    if (CONSOLE_TYPE === 'game') {
                        if (heartbeatTimer) {
                            clearInterval(heartbeatTimer);
                        }
                        heartbeatTimer = setInterval(() => {
                            if (ws && ws.readyState === WebSocket.OPEN) {
                                try {
                                    ws.send(JSON.stringify({ type: 'ping' }));
                                } catch (e) {
                                    console.error('Failed to send heartbeat:', e);
                                }
                            }
                        }, 30000); // Send ping every 30 seconds
                    }
                };
                
                ws.onmessage = (event) => {
                    handleMessage(event.data);
                };
                
                ws.onerror = (error) => {
                    console.error('WebSocket error:', error);
                    term.writeln('\x1b[31m✗ Connection error\x1b[0m');
                };
                
                ws.onclose = () => {
                    term.writeln('\r\n\x1b[33m✗ Disconnected\x1b[0m\r\n');
                    
                    // Clear heartbeat
                    if (heartbeatTimer) {
                        clearInterval(heartbeatTimer);
                        heartbeatTimer = null;
                    }
                    
                    // Auto-reconnect
                    if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
                        reconnectAttempts++;
                        term.writeln(`Reconnecting (attempt ${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS})...`);
                        reconnectTimer = setTimeout(connectWebSocket, 2000);
                    } else {
                        term.writeln('Reconnection failed. Please refresh the page.');
                    }
                };
                
            } catch (error) {
                console.error('Failed to create WebSocket:', error);
                term.writeln('\x1b[31mFailed to establish connection\x1b[0m');
            }
        }
        
        // Handle WebSocket messages
        function handleMessage(data) {
            try {
                const msg = JSON.parse(data);
                
                switch (msg.type) {
                    case 'connected':
                        term.writeln(`\x1b[32m${msg.message}\x1b[0m`);
                        term.writeln('');
                        break;
                        
                    case 'output':
                        term.write(msg.data);
                        break;
                        
                    case 'error':
                        term.writeln(`\r\n\x1b[31m✗ ${msg.message}\x1b[0m\r\n`);
                        break;
                        
                    case 'warning':
                        term.writeln(`\r\n\x1b[33m⚠ ${msg.data || msg.message}\x1b[0m\r\n`);
                        break;
                        
                    case 'pong':
                        // Heartbeat response - connection is alive
                        console.debug('Heartbeat OK');
                        break;
                        
                    default:
                        console.log('Unknown message type:', msg.type);
                }
            } catch (e) {
                // Not JSON, write as raw text
                term.write(data);
            }
        }
        
        // Cleanup on close
        window.addEventListener('beforeunload', () => {
            if (reconnectTimer) {
                clearTimeout(reconnectTimer);
            }
            
            if (heartbeatTimer) {
                clearInterval(heartbeatTimer);
            }
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                try {
                    ws.send(JSON.stringify({ type: 'disconnect' }));
                    ws.close();
                } catch (e) {
                    // Ignore errors during cleanup
                }
            }
            
            if (term) {
                term.dispose();
            }
        });
        
        // Initialize when page loads
        window.addEventListener('load', initTerminal);
    </script>
</body>
</html>
