                <div class="tab-pane fade" id="files" role="tabpanel" x-data="fileManager()">
                    <div class="card">
                        <div class="card-header bg-light">
                            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
                                <div>
                                    <h5 class="mb-0"><i class="bi bi-folder"></i> <span
                                            data-i18n="fileManager.title">File Manager</span></h5>
                                </div>
                                <div class="d-flex flex-wrap gap-2">
                                    <button @click="refreshFiles" class="btn btn-sm btn-outline-primary"
                                        :disabled="loading">
                                        <i class="bi"
                                            :class="loading ? 'bi-arrow-repeat spin' : 'bi-arrow-clockwise'"></i>
                                        <span data-i18n="common.refresh">Refresh</span>
                                    </button>
                                    <button @click="openCreateFolderModal()"
                                        class="btn btn-sm btn-outline-success">
                                        <i class="bi bi-folder-plus"></i>
                                        <span data-i18n="fileManager.newFolder">New Folder</span>
                                    </button>
                                    <button @click="document.getElementById('fileUpload').click()"
                                        class="btn btn-sm btn-outline-primary">
                                        <i class="bi bi-upload"></i>
                                        <span data-i18n="fileManager.upload">Upload</span>
                                    </button>
                                    <button @click="openUrlDownloadModal()"
                                        class="btn btn-sm btn-outline-info" :disabled="urlDownloading">
                                        <i class="bi bi-cloud-arrow-down"></i>
                                        <span data-i18n="fileManager.downloadFromUrl">Download URL</span>
                                    </button>
                                    <input type="file" id="fileUpload" style="display: none" @change="uploadFile"
                                        multiple>
                                </div>
                            </div>
                        </div>
                        <div class="card-body p-0">
                            <!-- Breadcrumb -->
                            <nav aria-label="breadcrumb" class="px-3 pt-3">
                                <ol class="breadcrumb mb-0">
                                    <template x-for="(part, index) in pathParts" :key="index">
                                        <li class="breadcrumb-item"
                                            :class="index === pathParts.length - 1 ? 'active' : ''">
                                            <a href="#" x-show="index < pathParts.length - 1"
                                                @click.prevent="navigateToPath(index)" x-text="part.name"></a>
                                            <span x-show="index === pathParts.length - 1" x-text="part.name"></span>
                                        </li>
                                    </template>
                                </ol>
                            </nav>

                            <!-- Upload Progress -->
                            <div x-show="uploading" class="px-3 pt-2">
                                <div class="alert alert-info mb-0">
                                    <div class="d-flex align-items-center justify-content-between mb-2">
                                        <div>
                                            <i class="bi bi-cloud-upload me-2"></i>
                                            <span data-i18n="fileManager.uploading">Uploading</span>:
                                            <strong x-text="uploadingFileName"></strong>
                                        </div>
                                        <span x-text="uploadProgress + '%'"></span>
                                    </div>
                                    <div class="progress" style="height: 6px;">
                                        <div class="progress-bar progress-bar-striped progress-bar-animated"
                                            :style="'width: ' + uploadProgress + '%'"></div>
                                    </div>
                                </div>
                            </div>

                            <!-- URL Download Progress -->
                            <div x-show="urlDownloading" x-cloak class="px-3 pt-2">
                                <div class="alert alert-info mb-0">
                                    <div class="d-flex flex-wrap align-items-start justify-content-between gap-2">
                                        <div class="text-break">
                                            <span class="spinner-border spinner-border-sm me-2"></span>
                                            <i class="bi bi-cloud-arrow-down me-1"></i>
                                            <span data-i18n="fileManager.downloadingFromUrl">Downloading from URL</span>:
                                            <strong x-text="urlDownloadProgress.fileName || urlDownloadProgress.targetPath || (window.i18n?.t('fileManager.archive') || 'Archive')"></strong>
                                            <small class="d-block text-muted mt-1" x-show="urlDownloadProgress.targetPath"
                                                x-text="urlDownloadProgress.targetPath"></small>
                                        </div>
                                        <div class="text-end text-nowrap">
                                            <span class="badge"
                                                :class="urlDownloadProgress.status === 'pending' ? 'bg-secondary' : 'bg-primary'"
                                                x-text="urlDownloadStatusLabel(urlDownloadProgress.status)"></span>
                                            <small class="ms-2 text-muted" x-show="urlDownloadProgress.elapsed > 0"
                                                x-text="urlDownloadProgress.elapsed + 's'"></small>
                                        </div>
                                    </div>
                                    <div class="d-flex justify-content-between mt-2"
                                        x-show="urlDownloadProgress.bytesDownloaded !== null || urlDownloadProgress.totalBytes !== null">
                                        <small class="text-muted"
                                            x-text="formatFileSize(urlDownloadProgress.bytesDownloaded || 0) + (urlDownloadProgress.totalBytes ? ' / ' + formatFileSize(urlDownloadProgress.totalBytes) : '')"></small>
                                        <small class="text-muted" x-show="urlDownloadProgress.percent !== null"
                                            x-text="urlDownloadProgress.percent + '%'"></small>
                                    </div>
                                    <div class="progress mt-2" style="height: 6px;">
                                        <div class="progress-bar progress-bar-striped progress-bar-animated"
                                            :style="urlDownloadProgress.percent === null ? 'width: 100%' : 'width: ' + urlDownloadProgress.percent + '%'">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Extraction Progress -->
                            <div x-show="extracting" class="px-3 pt-2">
                                <div class="alert alert-warning mb-0">
                                    <div class="d-flex align-items-center justify-content-between">
                                        <div>
                                            <span class="spinner-border spinner-border-sm me-2"></span>
                                            <i class="bi bi-file-zip me-1"></i>
                                            <span data-i18n="fileManager.extracting">Extracting</span>:
                                            <strong x-text="extractProgress.archiveName"></strong>
                                        </div>
                                        <div class="text-end">
                                            <span class="badge" 
                                                :class="{
                                                    'bg-secondary': extractProgress.status === 'pending',
                                                    'bg-primary': extractProgress.status === 'running',
                                                    'bg-success': extractProgress.status === 'completed',
                                                    'bg-danger': extractProgress.status === 'failed'
                                                }"
                                                x-text="extractProgress.status === 'pending' ? (window.i18n?.t('fileManager.extractPending') || 'Pending...') : 
                                                        extractProgress.status === 'running' ? (window.i18n?.t('fileManager.extractRunning') || 'Running...') :
                                                        extractProgress.status"></span>
                                            <small class="ms-2 text-muted" x-show="extractProgress.elapsed > 0" 
                                                x-text="extractProgress.elapsed + 's'"></small>
                                        </div>
                                    </div>
                                    <div class="progress mt-2" style="height: 4px;">
                                        <div class="progress-bar progress-bar-striped progress-bar-animated bg-warning" 
                                            style="width: 100%"></div>
                                    </div>
                                </div>
                            </div>

                            <!-- File List -->
                            <div class="file-browser">
                                <div x-show="loading" class="text-center py-5">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                </div>

                                <div x-show="!loading && files.length === 0" class="text-center py-5 text-muted">
                                    <i class="bi bi-folder-x" style="font-size: 3rem;"></i>
                                    <p class="mt-2" data-i18n="fileManager.emptyFolder">This folder is empty</p>
                                </div>

                                <div x-show="!loading && files.length > 0" class="table-responsive">
                                    <table class="table table-hover mb-0">
                                        <thead class="table-light sticky-top">
                                            <tr>
                                                <th width="50%"><i class="bi bi-file-text"></i> <span
                                                        data-i18n="fileManager.name">Name</span></th>
                                                <th width="15%"><i class="bi bi-arrows-angle-expand"></i> <span
                                                        data-i18n="fileManager.size">Size</span></th>
                                                <th width="20%"><i class="bi bi-clock"></i> <span
                                                        data-i18n="fileManager.modified">Modified</span></th>
                                                <th width="15%"><i class="bi bi-gear"></i> <span
                                                        data-i18n="common.actions">Actions</span></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <!-- Parent directory link -->
                                            <tr x-show="currentPath !== serverGameDirectory" class="parent-dir-row"
                                                @click="navigateUp()">
                                                <td colspan="4">
                                                    <i class="bi bi-arrow-90deg-up"></i>
                                                    <span data-i18n="fileManager.parentDirectory">Parent
                                                        Directory</span>
                                                </td>
                                            </tr>

                                            <!-- Files and directories -->
                                            <template x-for="file in files" :key="file.path">
                                                <tr class="file-row"
                                                    :class="selectedFile && selectedFile.path === file.path ? 'table-active' : ''"
                                                    @click="selectFile(file)"
                                                    @dblclick="file.type === 'directory' ? navigate(file.path) : openFile(file)">
                                                    <td>
                                                        <i class="bi"
                                                            :class="file.type === 'directory' ? 'bi-folder-fill text-warning' : getFileIcon(file.name)"></i>
                                                        <span class="ms-2" x-text="file.name"></span>
                                                        <small x-show="file.is_symlink"
                                                            class="badge bg-info ms-1">symlink</small>
                                                    </td>
                                                    <td>
                                                        <span x-show="file.type === 'file'"
                                                            x-text="formatFileSize(file.size)"></span>
                                                        <span x-show="file.type === 'directory'"
                                                            class="text-muted">-</span>
                                                    </td>
                                                    <td>
                                                        <small x-text="formatTimestamp(file.modified)"></small>
                                                    </td>
                                                    <td>
                                                        <div class="btn-group btn-group-sm" role="group">
                                                            <button x-show="file.type === 'file'"
                                                                @click.stop="downloadFile(file)"
                                                                class="btn btn-outline-primary" title="Download">
                                                                <i class="bi bi-download"></i>
                                                            </button>
                                                            <button
                                                                x-show="file.type === 'file' && isTextFile(file.name)"
                                                                @click.stop="editFile(file)"
                                                                class="btn btn-outline-secondary" title="Edit">
                                                                <i class="bi bi-pencil"></i>
                                                            </button>
                                                            <button
                                                                x-show="file.type === 'file' && isArchiveFile(file.name)"
                                                                @click.stop="showExtractModal(file)"
                                                                class="btn btn-outline-info" title="Extract">
                                                                <i class="bi bi-file-zip"></i>
                                                            </button>
                                                            <button @click.stop="copyFilePath(file)"
                                                                class="btn btn-outline-success" title="Copy Path">
                                                                <i class="bi bi-clipboard"></i>
                                                            </button>
                                                            <button @click.stop="showRenameModal(file)"
                                                                class="btn btn-outline-warning" title="Rename">
                                                                <i class="bi bi-pencil-square"></i>
                                                            </button>
                                                            <button @click.stop="deleteFile(file)"
                                                                class="btn btn-outline-danger" title="Delete">
                                                                <i class="bi bi-trash"></i>
                                                            </button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- File Editor Modal -->
                    <div class="modal fade" id="fileEditorModal" tabindex="-1">
                        <div class="modal-dialog modal-xl">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title">
                                        <i class="bi bi-file-text"></i>
                                        <span data-i18n="fileManager.editFile">Edit File</span>: <span
                                            x-text="editingFile ? editingFile.name : ''"></span>
                                    </h5>
                                    <button type="button" class="btn-close" @click="closeEditor()"></button>
                                </div>
                                <div class="modal-body">
                                    <div id="monacoEditor"></div>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" @click="closeEditor()"
                                        :disabled="savingFile" data-i18n="common.cancel">Cancel</button>
                                    <button type="button" class="btn btn-primary" @click="saveFile()"
                                        :disabled="savingFile">
                                        <span x-show="!savingFile && saveStatus === ''"
                                            data-i18n="common.save">Save</span>
                                        <span x-show="savingFile && saveStatus === 'submitting'">
                                            <span class="spinner-border spinner-border-sm me-1"></span>
                                            <span data-i18n="fileManager.submitting">Submitting...</span>
                                        </span>
                                        <span x-show="saveStatus === 'success'" class="text-success">
                                            <i class="bi bi-check-circle me-1"></i>
                                            <span data-i18n="fileManager.saved">Saved!</span>
                                        </span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Modals are teleported to body so Bootstrap backdrops never cover them inside the fading tab pane. -->
                    <template x-teleport="body">
                        <div class="modal fade" id="createFolderModal" tabindex="-1" aria-hidden="true">
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h5 class="modal-title" data-i18n="fileManager.newFolder">New Folder</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                    </div>
                                    <div class="modal-body">
                                        <label class="form-label" for="createFolderName"
                                            data-i18n="fileManager.folderName">Folder Name</label>
                                        <input type="text" class="form-control" id="createFolderName"
                                            x-model.trim="newFolderName" @keyup.enter="createFolder()">
                                    </div>
                                    <div class="modal-footer">
                                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"
                                            data-i18n="common.cancel">Cancel</button>
                                        <button type="button" class="btn btn-primary" @click="createFolder()"
                                            :disabled="!newFolderName.trim()" data-i18n="common.create">Create</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- Download from URL Modal -->
                    <template x-teleport="body">
                        <div class="modal fade" id="urlDownloadModal" tabindex="-1" aria-hidden="true">
                            <div class="modal-dialog modal-lg">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h5 class="modal-title">
                                            <i class="bi bi-cloud-arrow-down me-1"></i>
                                            <span data-i18n="fileManager.downloadFromUrl">Download URL</span>
                                        </h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal"
                                            :disabled="urlDownloadStarting"></button>
                                    </div>
                                    <div class="modal-body">
                                        <div class="mb-3">
                                            <label class="form-label" for="urlDownloadUrl"
                                                data-i18n="fileManager.downloadUrl">Archive URL</label>
                                            <input type="url" class="form-control" id="urlDownloadUrl"
                                                x-model.trim="urlDownloadUrl"
                                                data-i18n-placeholder="fileManager.downloadUrlPlaceholder"
                                                placeholder="https://example.com/archive.zip" autocomplete="off">
                                            <small class="form-text text-muted"
                                                data-i18n="fileManager.downloadUrlHint">Only HTTP and HTTPS URLs are supported.</small>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label" for="urlDownloadFilename"
                                                data-i18n="fileManager.downloadFilename">File name (optional)</label>
                                            <input type="text" class="form-control" id="urlDownloadFilename"
                                                x-model.trim="urlDownloadFilename"
                                                data-i18n-placeholder="fileManager.downloadFilenamePlaceholder"
                                                placeholder="Detected automatically from the URL">
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label" for="urlDownloadDestinationPath"
                                                data-i18n="fileManager.destinationPath">Destination Path</label>
                                            <input type="text" class="form-control font-monospace"
                                                id="urlDownloadDestinationPath"
                                                x-model.trim="urlDownloadDestinationPath">
                                            <small class="form-text text-muted"
                                                data-i18n="fileManager.urlDestinationHint">The archive will be saved in this server directory.</small>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="urlDownloadOverwrite"
                                                x-model="urlDownloadOverwrite">
                                            <label class="form-check-label" for="urlDownloadOverwrite"
                                                data-i18n="fileManager.overwriteExisting">Overwrite existing files</label>
                                        </div>
                                    </div>
                                    <div class="modal-footer">
                                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"
                                            :disabled="urlDownloadStarting" data-i18n="common.cancel">Cancel</button>
                                        <button type="button" class="btn btn-primary" @click="startUrlDownload()"
                                            :disabled="urlDownloadStarting || !urlDownloadUrl.trim() || !urlDownloadDestinationPath.trim()">
                                            <span x-show="!urlDownloadStarting">
                                                <i class="bi bi-download me-1"></i>
                                                <span data-i18n="fileManager.startDownload">Start Download</span>
                                            </span>
                                            <span x-show="urlDownloadStarting">
                                                <span class="spinner-border spinner-border-sm me-1"></span>
                                                <span data-i18n="fileManager.startingDownload">Starting...</span>
                                            </span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- Advanced Extract Archive Modal -->
                    <template x-teleport="body">
                        <div class="modal fade" id="extractModal" tabindex="-1" aria-hidden="true">
                            <div class="modal-dialog modal-lg modal-dialog-scrollable">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h5 class="modal-title">
                                            <i class="bi bi-file-zip me-1"></i>
                                            <span data-i18n="fileManager.advancedExtract">Advanced Extraction</span>
                                        </h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal"
                                            :disabled="extractStarting"></button>
                                    </div>
                                    <div class="modal-body">
                                        <div class="mb-3">
                                            <label class="form-label" for="extractArchivePath"
                                                data-i18n="fileManager.archivePath">Archive Path</label>
                                            <input type="text" class="form-control font-monospace"
                                                id="extractArchivePath" :value="extractArchivePath" disabled>
                                            <div class="d-flex flex-wrap gap-2 mt-2"
                                                x-show="extractArchiveType || extractArchiveEntryCount !== null">
                                                <span class="badge bg-info" x-show="extractArchiveType"
                                                    x-text="extractArchiveType"></span>
                                                <span class="badge bg-secondary" x-show="extractArchiveEntryCount !== null"
                                                    x-text="(extractArchiveEntryCount || 0) + ' ' + (window.i18n?.t('fileManager.archiveEntries') || 'entries')"></span>
                                            </div>
                                        </div>

                                        <div class="mb-3">
                                            <label class="form-label d-block"
                                                data-i18n="fileManager.extractContent">Content to extract</label>
                                            <div class="btn-group w-100" role="group">
                                                <input type="radio" class="btn-check" name="extractMode"
                                                    id="extractModeAll" value="all" x-model="extractMode">
                                                <label class="btn btn-outline-primary" for="extractModeAll">
                                                    <i class="bi bi-files me-1"></i>
                                                    <span data-i18n="fileManager.extractAll">Extract all contents</span>
                                                </label>
                                                <input type="radio" class="btn-check" name="extractMode"
                                                    id="extractModeFolder" value="folder" x-model="extractMode"
                                                    :disabled="extractInspecting || extractArchiveFolders.length === 0">
                                                <label class="btn btn-outline-primary" for="extractModeFolder"
                                                    :class="(extractInspecting || extractArchiveFolders.length === 0) ? 'disabled' : ''">
                                                    <i class="bi bi-folder me-1"></i>
                                                    <span data-i18n="fileManager.extractOneFolder">Extract one folder only</span>
                                                </label>
                                            </div>
                                        </div>

                                        <div class="mb-3" x-show="extractInspecting">
                                            <div class="d-flex align-items-center text-muted">
                                                <span class="spinner-border spinner-border-sm me-2"></span>
                                                <span data-i18n="fileManager.inspectingArchive">Reading archive contents...</span>
                                            </div>
                                        </div>

                                        <div class="alert alert-warning py-2" x-show="extractInspectError" x-cloak>
                                            <i class="bi bi-exclamation-triangle me-1"></i>
                                            <span x-text="extractInspectError"></span>
                                            <button type="button" class="btn btn-sm btn-outline-warning ms-2"
                                                @click="inspectArchive()" data-i18n="common.retry">Retry</button>
                                        </div>

                                        <div x-show="extractMode === 'folder'" x-cloak>
                                            <div class="mb-3">
                                                <label class="form-label" for="extractSourceFolder"
                                                    data-i18n="fileManager.sourceFolder">Folder in archive</label>
                                                <select class="form-select font-monospace" id="extractSourceFolder"
                                                    x-model="extractSourceFolder">
                                                    <option value="" data-i18n="fileManager.selectSourceFolder">Select a folder...</option>
                                                    <template x-for="folder in extractArchiveFolders" :key="folder">
                                                        <option :value="folder" x-text="folder"></option>
                                                    </template>
                                                </select>
                                            </div>
                                            <div class="form-check mb-3">
                                                <input class="form-check-input" type="checkbox"
                                                    id="extractStripSourceFolder" x-model="extractStripSourceFolder"
                                                    :disabled="!extractSourceFolder">
                                                <label class="form-check-label" for="extractStripSourceFolder"
                                                    data-i18n="fileManager.stripSourceFolder">Extract the folder's contents without the folder itself</label>
                                                <small class="form-text text-muted d-block"
                                                    data-i18n="fileManager.stripSourceFolderHint">When disabled, the selected folder is preserved at the destination.</small>
                                            </div>
                                        </div>

                                        <div class="mb-3">
                                            <label class="form-label" for="extractDestinationPath"
                                                data-i18n="fileManager.destinationPath">Destination Path</label>
                                            <input type="text" class="form-control font-monospace"
                                                id="extractDestinationPath" x-model.trim="extractDestinationPath">
                                            <small class="form-text text-muted"
                                                data-i18n="fileManager.absoluteDestinationHint">Enter an absolute path inside the server game directory.</small>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="extractOverwrite"
                                                x-model="extractOverwrite">
                                            <label class="form-check-label" for="extractOverwrite"
                                                data-i18n="fileManager.overwriteExisting">Overwrite existing files</label>
                                        </div>
                                    </div>
                                    <div class="modal-footer">
                                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"
                                            :disabled="extractStarting" data-i18n="common.cancel">Cancel</button>
                                        <button type="button" class="btn btn-primary" @click="extractArchive()"
                                            :disabled="extractStarting || !extractDestinationPath.trim() || (extractMode === 'folder' && !extractSourceFolder)">
                                            <span x-show="!extractStarting">
                                                <i class="bi bi-file-zip me-1"></i>
                                                <span data-i18n="fileManager.extract">Extract</span>
                                            </span>
                                            <span x-show="extractStarting">
                                                <span class="spinner-border spinner-border-sm me-1"></span>
                                                <span data-i18n="fileManager.startingExtraction">Starting...</span>
                                            </span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>

                </div>
